name: ludo_vibe
description: Premium Multiplayer Ludo Betting Game
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^13.2.0

  # Network
  dio: ^5.4.3
  socket_io_client: ^2.0.3+1
  web_socket_channel: ^2.4.5

  # Storage
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.3

  # UI & Animations
  lottie: ^3.1.0
  animate_do: ^3.3.4
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1

  # Utils
  intl: ^0.19.0
  connectivity_plus: ^6.0.3
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  riverpod_generator: ^2.4.0
  build_runner: ^2.4.9
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/appicon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/graphics/
    - assets/graphics/ludogamemode/
    - assets/graphics/dominogamemode/
    - assets/graphics/jackaroogamemode/
    - assets/graphics/othergamemode/
    - assets/graphics/events/
    - assets/graphics/profile/
    - assets/graphics/shop/
    - assets/graphics/shop/background/
    - assets/graphics/shop/pedestal/
    - assets/graphics/shop/icons/
    - assets/graphics/shop/labels/
    - assets/graphics/shop/ui/
    - assets/graphics/game/
    - assets/graphics/game/tiles/
    - assets/graphics/game/pieces/
    - assets/graphics/subscription/
    - assets/graphics/social/
    - assets/images/
    - assets/images/screens/
    - assets/fonts/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700