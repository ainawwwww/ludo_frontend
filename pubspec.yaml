name: ludo_vibe
description: Premium Multiplayer Ludo Betting Game
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^13.2.0

  # Network
  dio: ^5.4.3
  socket_io_client: ^2.0.3+1
  web_socket_channel: ^2.4.5

  # Storage
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.3

  # UI & Animations
  lottie: ^3.1.0
  animate_do: ^3.3.4
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1

  # Audio & Sounds
  audioplayers: ^6.0.0

  # Utils
  intl: ^0.19.0
  connectivity_plus: ^6.0.3
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  riverpod_generator: ^2.4.0
  build_runner: ^2.4.9
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/appicon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/graphics/
    - assets/graphics/ludogamemode/
    - assets/graphics/dominogamemode/
    - assets/graphics/jackaroogamemode/
    - assets/graphics/othergamemode/
    - assets/graphics/events/
    - assets/graphics/profile/
    - assets/graphics/shop/
    - assets/graphics/shop/01_dice_skins_DiceTab/
    - assets/graphics/shop/02_token_speech_bubble_frames_BubbleTab/
    - assets/graphics/shop/03_piece_color_sets_TokenTab/
    - assets/graphics/shop/04a_table_board_skins_named/
    - assets/graphics/shop/04b_table_board_skins_numbered_needs_naming/
    - assets/graphics/shop/05_tile_skins_TileTab/
    - assets/graphics/shop/06_theme_basic_wallpapers/
    - assets/graphics/shop/07_theme_royal_wallpapers/
    - assets/graphics/shop/08_ornaments/
    - assets/graphics/shop/09_royal_vehicles/
    - assets/graphics/shop/10_sticker_skins/
    - assets/graphics/shop/10_sticker_skins/01_sticker_pack_fox/
    - assets/graphics/shop/10_sticker_skins/02_sticker_pack_tiger/
    - assets/graphics/shop/10_sticker_skins/03_sticker_pack_emoji_faces/
    - assets/graphics/shop/10_sticker_skins/04_sticker_pack_royal_male/
    - assets/graphics/shop/10_sticker_skins/05_sticker_pack_royal_female/
    - assets/graphics/shop/10_sticker_skins/06_single_stickers/
    - assets/graphics/shop/10_sticker_skins/07_misc_decorative/
    - assets/graphics/shop/11_nav_tab_icons_buttons/
    - assets/graphics/shop/12_ui_backgrounds/
    - assets/graphics/shop/13_badges_selection_indicators/
    - assets/graphics/shop/14_buttons_generic/
    - assets/graphics/shop/15_main_screen_banner_icons/
    - assets/graphics/shop/17_misc_uncategorized/
    - assets/graphics/game/
    - assets/graphics/game/tiles/
    - assets/graphics/game/pieces/
    - assets/graphics/subscription/
    - assets/graphics/social/
    - assets/images/
    - assets/images/screens/
    - assets/fonts/
    - assets/sounds/
    - assets/sounds/SoundMain.mp3
    - assets/sounds/bg_music.mp3

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700